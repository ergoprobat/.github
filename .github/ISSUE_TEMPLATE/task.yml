name: Task or chore
description: A unit of planned work that is not a bug or a new feature.
labels: ["type:task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or decisions that must be done first.
